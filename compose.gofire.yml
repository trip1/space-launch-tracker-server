# gofire stack (docs: gofire docs/spec/docker.md). The stack gets its own LAN address; the app answers on :8080 there.
#   ssh PI 'git archive … | docker build -t space-launch-tracker:<sha> .'   (image must exist on the node; no registry)
#   gofire stack run space-launch --compose compose.gofire.yml --node pi-5-1
name: space-launch-tracker

services:
  app:
    image: space-launch-tracker:${TAG:-b87043a}
    init: true
    environment:
      HTTP_ADDR: ":8080"
      VALKEY_ADDR: "valkey:6379"
      SPACEDEVS_BASE_URL: "https://ll.thespacedevs.com/2.3.0/"
      SPACEDEVS_TIMEOUT: "15s"
      SPACEDEVS_CACHE_TTL: "15m"
      SPACEDEVS_LAUNCHES_LIMIT: "25"
      SPACEDEVS_EVENTS_LIMIT: "25"
      FCM_ENABLED: "false"
      NOTIFICATION_POLL_INTERVAL: "5m"
    depends_on:
      valkey:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.75
    stop_grace_period: 10s

  valkey:
    image: valkey/valkey@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    user: "999:1000"
    command: [valkey-server, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, allkeys-lru, --bind, 127.0.0.1]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    read_only: true
    tmpfs:
      - /data:size=96m,mode=0700,uid=999,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
